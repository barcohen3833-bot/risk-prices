<!doctype html>
<html><head><meta charset="utf-8"><style>html,body{margin:0;background:#000;overflow:hidden}canvas{display:block}</style>
<script type="importmap">{"imports":{"three":"/node_modules/three/build/three.module.js","three/addons/":"/node_modules/three/examples/jsm/"}}</script>
</head><body>
<script type="module">
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';

const P = new URLSearchParams(location.search);
const W = +P.get('w') || 1920, H = +P.get('h') || 1080;
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1);
renderer.setSize(W, H);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x000000);
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = 0.9;

const camera = new THREE.PerspectiveCamera(30, W / H, 0.1, 100);
// shift the watch to the right third so the hero copy (bottom-left) never covers it
camera.setViewOffset(W, H, -Math.round(W * 0.14), 0, W, H);

// lights: rim + key, keep background pure black
const key = new THREE.DirectionalLight(0xfff1dc, 2.2); key.position.set(4, 6, 8); scene.add(key);
const rim = new THREE.DirectionalLight(0xffd9a0, 1.6); rim.position.set(-6, 3, -5); scene.add(rim);
const fill = new THREE.DirectionalLight(0xffffff, 0.5); fill.position.set(-3, -4, 6); scene.add(fill);

// materials
const gold = new THREE.MeshStandardMaterial({ color: 0xe0a882, metalness: 1, roughness: 0.22 }); // rose/everose-like
const goldBrushed = new THREE.MeshStandardMaterial({ color: 0xd49c78, metalness: 1, roughness: 0.38 });
const steel = new THREE.MeshStandardMaterial({ color: 0xc9ccd2, metalness: 1, roughness: 0.3 });
const ruby = new THREE.MeshStandardMaterial({ color: 0xa0122a, metalness: 0.2, roughness: 0.15 });
const handMat = new THREE.MeshStandardMaterial({ color: 0xf0c6a8, metalness: 1, roughness: 0.15 });

// sunburst chocolate dial texture
function dialTexture() {
  const s = 1024, c = document.createElement('canvas'); c.width = c.height = s;
  const g = c.getContext('2d');
  const grd = g.createRadialGradient(s/2, s/2, 10, s/2, s/2, s/2);
  grd.addColorStop(0, '#6b3a22'); grd.addColorStop(0.6, '#4a2414'); grd.addColorStop(1, '#2a120a');
  g.fillStyle = grd; g.fillRect(0, 0, s, s);
  // sunburst rays
  for (let i = 0; i < 720; i++) {
    const a = i / 720 * Math.PI * 2;
    g.strokeStyle = `rgba(255,200,160,${0.02 + 0.05 * Math.abs(Math.sin(a * 2))})`;
    g.lineWidth = 1;
    g.beginPath(); g.moveTo(s/2, s/2); g.lineTo(s/2 + Math.cos(a) * s/2, s/2 + Math.sin(a) * s/2); g.stroke();
  }
  // minute track
  g.strokeStyle = 'rgba(240,200,170,0.75)';
  for (let i = 0; i < 60; i++) {
    const a = i / 60 * Math.PI * 2, r1 = s * 0.47, r2 = s * (i % 5 ? 0.455 : 0.44);
    g.lineWidth = i % 5 ? 2 : 4;
    g.beginPath(); g.moveTo(s/2 + Math.cos(a) * r1, s/2 + Math.sin(a) * r1);
    g.lineTo(s/2 + Math.cos(a) * r2, s/2 + Math.sin(a) * r2); g.stroke();
  }
  g.fillStyle = 'rgba(240,205,175,0.9)';
  g.font = '600 34px Georgia, serif'; g.textAlign = 'center';
  g.fillText('VÉRANE', s/2, s * 0.34);
  g.font = 'italic 22px Georgia, serif';
  g.fillText('Perpétuel · Genève', s/2, s * 0.70);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8;
  return t;
}
const dialMat = new THREE.MeshStandardMaterial({ map: dialTexture(), metalness: 0.55, roughness: 0.35 });

const watch = new THREE.Group(); scene.add(watch);
const parts = []; // {obj, base:Vector3, off:Vector3, rot:Euler offset, delay}
function part(obj, off, opts = {}) {
  watch.add(obj);
  parts.push({ obj, base: obj.position.clone(), baseRot: obj.rotation.clone(), off: new THREE.Vector3(...off),
               spin: opts.spin || [0, 0, 0], delay: opts.delay || 0 });
  return obj;
}
// helpers: lathe ring profile (points in x=r, y=z)
function lathe(points, seg = 128) {
  const g = new THREE.LatheGeometry(points.map(p => new THREE.Vector2(p[0], p[1])), seg);
  g.rotateX(Math.PI / 2); // axis -> z
  return g;
}

// CASE (middle) - ring with lugs
const caseGeo = lathe([[0.92, -0.18], [1.0, -0.16], [1.04, -0.05], [1.04, 0.08], [1.0, 0.14], [0.92, 0.15]]);
const caseMesh = new THREE.Mesh(caseGeo, gold);
part(caseMesh, [0, 0, 0]);
// lugs
for (const sy of [1, -1]) for (const sx of [1, -1]) {
  const lug = new THREE.Mesh(new RoundedBoxGeometry(0.16, 0.42, 0.22, 3, 0.05), gold);
  lug.position.set(sx * 0.52, sy * 1.02, -0.02);
  lug.rotation.z = sx * sy * -0.12;
  caseMesh.add(lug);
}

// CASEBACK
const back = new THREE.Mesh(lathe([[0, -0.30], [0.55, -0.29], [0.8, -0.25], [0.9, -0.2], [0.92, -0.17]]), goldBrushed);
part(back, [0, 0, -2.4], { spin: [0, 0, 0.6], delay: 0.05 });

// MOVEMENT PLATE + gears
const movement = new THREE.Group();
const plate = new THREE.Mesh(new THREE.CylinderGeometry(0.86, 0.86, 0.06, 96), steel);
plate.rotation.x = Math.PI / 2; movement.add(plate);
function gear(r, teeth, x, y, mat) {
  const sh = new THREE.Shape();
  for (let i = 0; i <= teeth * 2; i++) {
    const a = i / (teeth * 2) * Math.PI * 2, rr = i % 2 ? r : r * 0.88;
    i ? sh.lineTo(Math.cos(a) * rr, Math.sin(a) * rr) : sh.moveTo(rr, 0);
  }
  const hole = new THREE.Path(); hole.absarc(0, 0, r * 0.2, 0, Math.PI * 2, true); sh.holes.push(hole);
  const m = new THREE.Mesh(new THREE.ExtrudeGeometry(sh, { depth: 0.03, bevelEnabled: false, curveSegments: 4 }), mat);
  m.position.set(x, y, 0.04); return m;
}
movement.add(gear(0.32, 40, -0.25, 0.2, gold), gear(0.2, 28, 0.3, 0.32, gold), gear(0.24, 32, 0.22, -0.3, gold), gear(0.14, 20, -0.35, -0.35, gold));
for (const [x, y] of [[-0.25, 0.2], [0.3, 0.32], [0.22, -0.3], [-0.35, -0.35], [0.55, 0], [-0.6, 0.1]]) {
  const j = new THREE.Mesh(new THREE.SphereGeometry(0.03, 16, 12), ruby); j.position.set(x, y, 0.08); movement.add(j);
}
movement.position.z = -0.14;
part(movement, [0, 0, -1.45], { spin: [0, 0, -0.4], delay: 0.08 });

// ROTOR (half disc)
const rotorShape = new THREE.Shape(); rotorShape.absarc(0, 0, 0.82, 0, Math.PI, false); rotorShape.lineTo(-0.82, 0);
const rotorHole = new THREE.Path(); rotorHole.absarc(0, 0, 0.08, 0, Math.PI * 2, true); rotorShape.holes.push(rotorHole);
const rotor = new THREE.Mesh(new THREE.ExtrudeGeometry(rotorShape, { depth: 0.035, bevelEnabled: true, bevelSize: 0.01, bevelThickness: 0.01, curveSegments: 48 }), gold);
rotor.position.z = -0.24;
part(rotor, [0, 0, -1.95], { spin: [0, 0, 2.2], delay: 0.06 });

// DIAL
const dial = new THREE.Mesh(new THREE.CircleGeometry(0.9, 128), dialMat);
dial.position.z = 0.04;
// applied indices
for (let i = 0; i < 12; i++) {
  const a = i / 12 * Math.PI * 2;
  const idx = new THREE.Mesh(new THREE.BoxGeometry(i % 3 ? 0.035 : 0.06, 0.15, 0.025), handMat);
  idx.position.set(Math.sin(a) * 0.7, Math.cos(a) * 0.7, 0.015); idx.rotation.z = -a; dial.add(idx);
}
part(dial, [0, 0, 1.0], { delay: 0.1 });

// HANDS
const hands = new THREE.Group(); hands.position.z = 0.1;
const hourH = new THREE.Mesh(new THREE.BoxGeometry(0.06, 0.48, 0.015), handMat); hourH.geometry.translate(0, 0.2, 0); hourH.rotation.z = -0.9;
const minH = new THREE.Mesh(new THREE.BoxGeometry(0.04, 0.72, 0.015), handMat); minH.geometry.translate(0, 0.32, 0.02); minH.rotation.z = 2.2;
const secH = new THREE.Mesh(new THREE.BoxGeometry(0.012, 0.82, 0.01), handMat); secH.geometry.translate(0, 0.3, 0.04); secH.rotation.z = 0.5;
const hub = new THREE.Mesh(new THREE.CylinderGeometry(0.045, 0.045, 0.06, 32), handMat); hub.rotation.x = Math.PI / 2;
hands.add(hourH, minH, secH, hub);
part(hands, [0, 0, 1.55], { spin: [0, 0, -0.8], delay: 0.12 });

// CRYSTAL
const crystal = new THREE.Mesh(new THREE.CylinderGeometry(0.9, 0.9, 0.05, 96),
  new THREE.MeshPhysicalMaterial({ color: 0xffffff, metalness: 0, roughness: 0.02, transmission: 1, thickness: 0.05, transparent: true, opacity: 0.18, ior: 1.7 }));
crystal.rotation.x = Math.PI / 2; crystal.position.z = 0.16;
part(crystal, [0, 0, 2.05], { delay: 0.14 });

// BEZEL (fluted)
const bezel = new THREE.Group();
bezel.add(new THREE.Mesh(lathe([[0.88, 0.15], [1.02, 0.15], [1.0, 0.21], [0.9, 0.24], [0.88, 0.22]]), gold));
for (let i = 0; i < 72; i++) {
  const a = i / 72 * Math.PI * 2;
  const f = new THREE.Mesh(new THREE.BoxGeometry(0.018, 0.12, 0.07), gold);
  f.position.set(Math.sin(a) * 0.96, Math.cos(a) * 0.96, 0.2); f.rotation.z = -a; f.rotation.x = 0.0; bezel.add(f);
}
part(bezel, [0, 0, 2.6], { spin: [0, 0, 0.5], delay: 0.16 });

// CROWN
const crown = new THREE.Group();
const crownC = new THREE.Mesh(new THREE.CylinderGeometry(0.11, 0.11, 0.14, 32), gold); crownC.rotation.z = Math.PI / 2; crown.add(crownC);
const stem = new THREE.Mesh(new THREE.CylinderGeometry(0.03, 0.03, 0.2, 12), steel); stem.rotation.z = Math.PI / 2; stem.position.x = -0.12; crown.add(stem);
crown.position.set(1.12, 0, -0.01);
part(crown, [1.4, 0, 0.1], { spin: [2.5, 0, 0], delay: 0.1 });

// BRACELET – three-piece links up and down
function linkRow(i, dir) {
  const g = new THREE.Group();
  const y = dir * (1.28 + i * 0.3);
  const w = 0.9 - Math.min(i, 4) * 0.025;
  const outer = new RoundedBoxGeometry(w * 0.32, 0.27, 0.16, 2, 0.04);
  const center = new RoundedBoxGeometry(w * 0.32, 0.27, 0.18, 2, 0.05);
  const l = new THREE.Mesh(outer, goldBrushed); l.position.x = -w * 0.34;
  const r = new THREE.Mesh(outer, goldBrushed); r.position.x = w * 0.34;
  const c = new THREE.Mesh(center, gold);
  g.add(l, r, c);
  // bend bracelet backwards
  const bend = Math.max(0, i - 1) * 0.16;
  g.position.set(0, y, -0.06 - bend * bend * 0.9);
  g.rotation.x = dir * bend * 0.9;
  return g;
}
for (const dir of [1, -1]) for (let i = 0; i < 5; i++) {
  const g = linkRow(i, dir);
  part(g, [0, dir * (0.55 + i * 0.32), -0.25 - i * 0.12], { spin: [dir * 0.25, 0, (i % 2 ? 1 : -1) * 0.15], delay: 0.02 + i * 0.02 });
}
// clasp
const clasp = new THREE.Mesh(new RoundedBoxGeometry(0.62, 0.9, 0.12, 3, 0.05), gold);
clasp.position.set(0, 0, -3.1); clasp.rotation.x = Math.PI / 2;


watch.rotation.x = -0.12; // slight tilt

// animation
const ease = t => t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
window.renderAt = (t) => { // t in [0,1]
  // camera orbit: from front-right (+55°) clockwise to front (0°) at t=.5, then to -35°
  const ang = THREE.MathUtils.degToRad(55 - 90 * ease(t));
  const elev = THREE.MathUtils.degToRad(14 - 6 * t);
  const dist = 10.8 + 3.6 * ease(clamp((t - 0.45) / 0.5));
  camera.position.set(Math.sin(ang) * Math.cos(elev) * dist, Math.sin(elev) * dist, Math.cos(ang) * Math.cos(elev) * dist);
  camera.lookAt(0, 0, -0.2);
  for (const p of parts) {
    const e = ease(clamp((t - 0.45 - p.delay * 0.6) / 0.45));
    p.obj.position.copy(p.base).addScaledVector(p.off, e);
    p.obj.rotation.set(p.baseRot.x + p.spin[0] * e, p.baseRot.y + p.spin[1] * e, p.baseRot.z + p.spin[2] * e);
  }
  watch.rotation.y = 0.15 * Math.sin(t * Math.PI);
  renderer.render(scene, camera);
  return true;
};
window.renderAt(0);
window.ready = true;
</script></body></html>
